; PlatformIO config for the HX711 scale node.
; The sketch stays as scale_node.ino in this folder (src_dir = .), so the
; Arduino IDE and CI keep working unchanged.
;
; Pick the environment that matches your board from the PlatformIO status bar:
;   nano_new  - Arduino Nano, new bootloader (most genuine Nanos)      <- default
;   nano_old  - Arduino Nano clone with the old bootloader (CH340 boards)
;   uno       - Arduino Uno

[platformio]
src_dir = .
default_envs = nano_new

[env]
platform = atmelavr
framework = arduino
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
monitor_speed = 9600

[env:nano_new]
board = nanoatmega328new

[env:nano_old]
board = nanoatmega328

[env:uno]
board = uno
