; PlatformIO config for the AI-Thinker ESP32-CAM.
; The sketch stays as fridge_cam.ino + config.h in this folder (src_dir = .).
;
; First flash over USB: with an ESP32-CAM-MB just dock the board, plug in USB, Upload.
; With a bare USB-serial adapter, wire it as in edge/README.md, tie IO0 to GND,
; press RST, Upload, then remove the jumper and press RST again.
; Every later update goes over Wi-Fi: see [env:esp32cam_ota] below.

[platformio]
src_dir = .
default_envs = esp32cam
; ota_local.ini (gitignored) holds this board's IP and OTA password; see ota_local.ini.example
extra_configs = ota_local.ini

[env:esp32cam]
platform = espressif32
framework = arduino
board = esp32cam
; two app slots so the board can update itself over Wi-Fi (default esp32cam layout has one slot, no OTA)
board_build.partitions = min_spiffs.csv
build_src_filter = +<*.ino> +<*.cpp> +<*.c>
upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Same firmware, uploaded over Wi-Fi instead of USB:  pio run -e esp32cam_ota -t upload
; upload_port and the password come from ota_local.ini.
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
