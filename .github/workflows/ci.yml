name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autobasket
          POSTGRES_PASSWORD: autobasket
          POSTGRES_DB: autobasket
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U autobasket"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AB_PG_URL: postgresql+psycopg://autobasket:autobasket@localhost:5433/autobasket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint backend and edge
        run: ruff check backend edge --config backend/pyproject.toml
      - name: Run backend tests
        run: pytest backend/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          cp .env.production.example .env.production
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production build

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install cores
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile scale node (Arduino Uno)
        run: arduino-cli compile --fqbn arduino:avr:uno edge/arduino/scale_node
      - name: Compile fridge camera (ESP32-CAM)
        run: |
          cp edge/esp32cam/fridge_cam/config.h.example edge/esp32cam/fridge_cam/config.h
          arduino-cli compile --fqbn esp32:esp32:esp32cam edge/esp32cam/fridge_cam
