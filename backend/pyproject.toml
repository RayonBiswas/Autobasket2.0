[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = import sorting, B = bugbear (common mistakes), UP = modern syntax
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
  "E501", # line length is handled by the formatter
  "B008", # FastAPI's `Depends()` in defaults is the framework idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local migrations folder is also called "alembic"; without this ruff sorts the library as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # SQLAlchemy 2 still emits this for declarative_base(); we migrate in Phase 1.
  "ignore::sqlalchemy.exc.MovedIn20Warning",
]
